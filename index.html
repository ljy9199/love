<!-- 声明文档类型为HTML5，标准网页开头 -->
<!DOCTYPE html>
<!-- 网页根标签，设置语言为简体中文 -->
<html lang="zh-CN">
<!-- 头部：存放网页设置、标题、样式等 -->
<head>
    <!-- 设置字符编码为UTF-8，防止中文乱码 -->
    <meta charset="UTF-8">
    <!-- 适配手机屏幕：宽度=设备宽度，初始缩放1倍，禁止用户缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- 苹果手机专用：让网页全屏显示，隐藏浏览器工具栏 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- 网页标题，显示在浏览器标签上 -->
    <title>杰佣留言卡片(双)</title>
    <!-- 样式标签：写CSS，控制页面颜色、大小、布局、外观 -->
    <style>
        /* ======================== 全局样式 ======================== */
        /* * 代表所有元素，统一清除默认边距、设置盒模型、字体 */
        * {
            margin: 0;            /* 清除外边距 */
            padding: 0;           /* 清除内边距 */
            box-sizing: border-box;/* 宽高包含边框和内边距，不会变形 */
            /* 设置优先显示的字体，保证苹果/安卓都好看 */
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        /* body 整个网页的背景和基础边距 */
        body {
            background-color: #f5f5f5; /* 浅灰色背景 */
            padding: 15px;             /* 四周留15px空隙 */
        }

        /* ======================== 编辑区域外层容器 ======================== */
        .editor-wrap {
            width: 100%;           /* 宽度占满屏幕 */
            overflow: hidden;      /* 隐藏超出部分，实现滑动效果 */
            border-radius: 12px;   /* 圆角 */
            margin-bottom: 15px;   /* 底部留间距 */
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); /* 轻微阴影 */
            position: relative;    /* 定位基准 */
        }

        /* 滑动条：装两个编辑卡片，实现左右滑动 */
        .editor-slider {
            display: flex;         /* 横向排列 */
            transition: transform 0.3s ease; /* 滑动动画0.3秒 */
        }

        /* 单个编辑卡片 */
        .editor {
            width: 100%;           /* 每个卡片占满屏幕宽度 */
            flex-shrink: 0;        /* 不压缩宽度 */
            background: #fff;      /* 白色背景 */
            padding: 15px;         /* 内边距 */
            position: relative;    /* 定位 */
        }

        /* 页面指示器（底部两个滑动条） */
        .page-indicator {
            display: flex;         /* 横向排列 */
            justify-content: center;/* 水平居中 */
            align-items: center;   /* 垂直居中 */
            gap: 4px;              /* 两个条之间留4px空隙 */
            width: 100%;           /* 宽度占满 */
            margin-left: 0;        /* 左间距0 */
            margin-right: 0;       /* 右间距0 */
            margin-top: 10px;      /* 顶部留10px间距 */
        }

        /* 指示器单个长条 */
        .page-indicator .bar {
            flex: 1;               /* 自动平分宽度 */
            height: 5px;           /* 高度5px */
            border-radius: 3px;    /* 小圆角 */
            background: transparent;/* 默认透明 */
            border: 1px solid #ccc;/* 灰色边框 */
            transition: all 0.3s ease;/* 过渡动画 */
        }

        /* 激活状态的指示器 */
        .page-indicator .bar.active {
            background: #ccc;      /* 灰色填充 */
        }

        /* 编辑卡片标题（卡片1 / 卡片2） */
        .editor h3 {
            font-size: 18px;       /* 字体大小 */
            margin-bottom: 12px;   /* 底部间距 */
            color: #333;           /* 深灰色文字 */
            text-align: center;    /* 居中 */
        }

        /* 每个表单项的间距 */
        .editor-item {
            margin-bottom: 10px;   /* 底部间距 */
        }

        /* 输入框前面的文字（头像、名字、留言） */
        .editor-item label {
            display: block;        /* 独占一行 */
            font-size: 14px;       /* 字体大小 */
            color: #666;           /* 灰色文字 */
            margin-bottom: 4px;    /* 底部间距 */
        }

        /* 头像上传区域布局 */
        .avatar-upload {
            display: flex;         /* 横向排列 */
            align-items: center;   /* 垂直居中 */
            gap: 10px;             /* 元素之间空隙 */
        }

        /* 隐藏原生文件选择按钮 */
        #avatarInput1,#avatarInput2 {
            display: none;
        }

        /* 上传按钮样式 */
        .upload-btn {
            background: #999;      /* 灰色背景 */
            color: #fff;           /* 白色文字 */
            padding: 6px 12px;     /* 内边距 */
            border-radius: 8px;    /* 圆角 */
            font-size: 14px;       /* 文字大小 */
            cursor: pointer;       /* 鼠标移上去变手型 */
            border: none;          /* 无边框 */
        }

        /* 小头像预览图 */
        .preview-avatar-small {
            width: 40px;           /* 宽40px */
            height: 40px;          /* 高40px */
            border-radius: 50%;    /* 正圆形 */
            background: #eee;      /* 灰色背景 */
            object-fit: cover;     /* 图片不变形裁剪 */
        }

        /* 输入框、文本框通用样式 */
        .editor-item input,.editor-item textarea {
            width: 100%;           /* 宽度占满 */
            padding: 8px 12px;     /* 内边距 */
            border: 1px solid #ddd;/* 浅灰色边框 */
            border-radius: 8px;    /* 圆角 */
            font-size: 14px;       /* 文字大小 */
            outline: none;         /* 去掉选中时的默认边框 */
        }

        /* 输入框被选中时的样式 */
        .editor-item input:focus,.editor-item textarea:focus {
            border-color: #0088ff; /* 边框变蓝色 */
        }

        /* ======================== 预览卡片样式 ======================== */
        /* 预览卡片外层 */
        .preview {
            background: #fff;      /* 白色背景 */
            padding: 20px;         /* 内边距 */
            border-radius: 12px;   /* 圆角 */
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); /* 阴影 */
            margin-bottom: 15px;   /* 底部间距 */
        }

        /* 留言卡片布局 */
        .message-card {
            display: flex;         /* 横向排列 */
            align-items: flex-start;/* 顶部对齐 */
            gap: 12px;             /* 头像和内容间距 */
        }

        /* 预览大头像 */
        .avatar {
            width: 60px;           /* 宽60px */
            height: 60px;          /* 高60px */
            border-radius: 50%;    /* 正圆 */
            object-fit: cover;     /* 图片裁剪 */
            background: #eee;      /* 默认灰色 */
        }

        /* 文字内容区域 */
        .content {
            flex: 1;               /* 占满剩余宽度 */
        }

        /* 名字样式 */
        .name {
            font-size: 15px;       /* 文字大小 */
            font-weight: bold;     /* 加粗 */
            color: #333;           /* 深灰 */
            margin-bottom: 6px;    /* 底部间距 */
        }

        /* 留言文字 */
        .text {
            font-size: 14px;       /* 文字大小 */
            color: #333;           /* 深灰 */
            line-height: 1.4;      /* 行高 */
            margin-bottom: 10px;   /* 底部间距 */
        }

        /* 底部信息（来源、时间、点赞） */
        .footer {
            display: flex;         /* 横向排列 */
            justify-content: space-between;/* 两端分散对齐 */
            align-items: center;   /* 垂直居中 */
            width: 100%;           /* 宽度占满 */
            font-size: 12px;       /* 文字大小 */
            color: #999;           /* 浅灰色 */
        }

        /* ======================== 手机小屏适配 ======================== */
        @media (max-width: 375px) {
            .avatar {
                width: 50px;
                height: 50px;
            }
            .name {
                font-size: 15px;
            }
            .text {
                font-size: 14px;
            }
            .footer {
                font-size: 12px;
            }
        }

        /* 顶部提示文字 */
        .hint {
            text-align: center;    /* 居中 */
            font-size: 12px;       /* 小字 */
            color: #999;           /* 浅灰 */
            margin-bottom: 10px;   /* 底部间距 */
        }
    </style>
</head>

<!-- 身体：网页能看到的内容都在这里 -->
<body>
    <!-- 顶部提示文字 -->
    <div class="hint">卡片1左滑→卡片2｜卡片2右滑→卡片1</div>

    <!-- 编辑区域外层 -->
    <div class="editor-wrap" id="editorWrap">
        <!-- 滑动容器 -->
        <div class="editor-slider" id="editorSlider">
            <!-- 卡片1编辑区 -->
            <div class="editor">
                <h3>卡片1</h3>
                <!-- 头像上传 -->
                <div class="editor-item">
                    <label>头像：</label>
                    <div class="avatar-upload">
                        <button class="upload-btn" onclick="document.getElementById('avatarInput1').click()">选择图片</button>
                        <img class="preview-avatar-small" id="smallAvatar1" src="校园杰克.jpg">
                        <input type="file" id="avatarInput1" accept="image/*" onchange="previewAvatar(1, this)">
                    </div>
                </div>
                <!-- 名字输入 -->
                <div class="editor-item">
                    <label>名字：</label>
                    <input type="text" id="userName1" value="杰克" oninput="updateCard1()">
                </div>
                <!-- 留言输入 -->
                <div class="editor-item">
                    <label>留言：</label>
                    <textarea id="messageText1" rows="2" oninput="updateCard1()">“@奈布：学长，等你下课一起走好吗？”</textarea>
                </div>
                <!-- 来源输入 -->
                <div class="editor-item">
                    <label>来源：</label>
                    <input type="text" id="sourceText1" value="来自杰克的留言" oninput="updateCard1()">
                </div>
                <!-- 时间输入 -->
                <div class="editor-item">
                    <label>时间：</label>
                    <input type="text" id="timeText1" value="5:20pm" oninput="updateCard1()">
                </div>
                <!-- 点赞数输入 -->
                <div class="editor-item">
                    <label>点赞数：</label>
                    <input type="text" id="likeNum1" value="1314" oninput="updateCard1()">
                </div>
                <!-- 滑动指示器 -->
                <div class="page-indicator">
                    <div class="bar active" id="bar1"></div>
                    <div class="bar" id="bar2"></div>
                </div>
            </div>

            <!-- 卡片2编辑区（结构和卡片1完全一样） -->
            <div class="editor">
                <h3>卡片2</h3>
                <div class="editor-item">
                    <label>头像：</label>
                    <div class="avatar-upload">
                        <button class="upload-btn" onclick="document.getElementById('avatarInput2').click()">选择图片</button>
                        <img class="preview-avatar-small" id="smallAvatar2" src="校园奈布.jpg">
                        <input type="file" id="avatarInput2" accept="image/*" onchange="previewAvatar(2, this)">
                    </div>
                </div>
                <div class="editor-item">
                    <label>名字：</label>
                    <input type="text" id="userName2" value="奈布" oninput="updateCard2()">
                </div>
                <div class="editor-item">
                    <label>留言：</label>
                    <textarea id="messageText2" rows="2" oninput="updateCard2()">“@杰克 约架？”</textarea>
                </div>
                <div class="editor-item">
                    <label>来源：</label>
                    <input type="text" id="sourceText2" value="来自奈布的留言" oninput="updateCard2()">
                </div>
                <div class="editor-item">
                    <label>时间：</label>
                    <input type="text" id="timeText2" value="5:21pm" oninput="updateCard2()">
                </div>
                <div class="editor-item">
                    <label>点赞数：</label>
                    <input type="text" id="likeNum2" value="520" oninput="updateCard2()">
                </div>
                <div class="page-indicator">
                    <div class="bar active" id="bar1-2"></div>
                    <div class="bar" id="bar2-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 卡片1预览展示区 -->
    <div class="preview">
        <div class="message-card">
            <img class="avatar" id="previewAvatar1" src="校园杰克.jpg">
            <div class="content">
                <div class="name" id="previewName1">杰克</div>
                <div class="text" id="previewText1">“@奈布：学长，等你下课一起走好吗？”</div>
                <div class="footer">
                    <span id="previewSource1">来自杰克的留言</span>
                    <span id="previewTime1">5:20pm</span>
                    <span id="previewLike1">点赞1314</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 卡片2预览展示区 -->
    <div class="preview">
        <div class="message-card">
            <img class="avatar" id="previewAvatar2" src="校园奈布.jpg">
            <div class="content">
                <div class="name" id="previewName2">奈布</div>
                <div class="text" id="previewText2">“@杰克 约架？”</div>
                <div class="footer">
                    <span id="previewSource2">来自奈布的留言</span>
                    <span id="previewTime2">5:21pm</span>
                    <span id="previewLike2">点赞520</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本：实现滑动、上传、实时更新功能 -->
    <script>
        // 获取滑动元素
        const slider = document.getElementById('editorSlider');
        // 定义变量：起始X坐标、是否正在滑动、当前页码（0=卡片1，1=卡片2）
        let startX = 0,moving = false,currentPage = 0;

        // 获取所有指示器元素
        const bar1 = document.getElementById('bar1');
        const bar2 = document.getElementById('bar2');
        const bar1_2 = document.getElementById('bar1-2');
        const bar2_2 = document.getElementById('bar2-2');

        // 更新指示器状态（哪个亮）
        function updateIndicator() {
            if (currentPage === 0) {
                bar1.classList.add('active');
                bar2.classList.remove('active');
                bar1_2.classList.add('active');
                bar2_2.classList.remove('active');
            } else {
                bar1.classList.remove('active');
                bar2.classList.add('active');
                bar1_2.classList.remove('active');
                bar2_2.classList.add('active');
            }
        }

        // 手机触摸开始
        document.getElementById('editorWrap').addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
        });

        // 手机触摸滑动
        document.getElementById('editorWrap').addEventListener('touchmove', e => {
            moving = true;
            const dx = e.touches[0].clientX - startX;
            slider.style.transform = `translateX(${-currentPage * 100 + dx / document.body.clientWidth * 100}%)`;
        });

        // 手机触摸结束
        document.getElementById('editorWrap').addEventListener('touchend', e => {
            if (!moving) return;
            moving = false;
            const dx = e.changedTouches[0].clientX - startX;
            // 判断是否切换页面
            if (currentPage === 0 && dx < -50) {
                currentPage = 1;
            } else if (currentPage === 1 && dx > 50) {
                currentPage = 0;
            }
            // 执行滑动
            slider.style.transform = `translateX(${-currentPage * 100}%)`;
            updateIndicator();
        });

        // 电脑鼠标按下
        document.getElementById('editorWrap').addEventListener('mousedown', e => {
            startX = e.clientX;
            moving = true;
        });

        // 电脑鼠标移动
        document.addEventListener('mousemove', e => {
            if (!moving) return;
            const dx = e.clientX - startX;
            slider.style.transform = `translateX(${-currentPage * 100 + dx / document.body.clientWidth * 100}%)`;
        });

        // 电脑鼠标松开
        document.addEventListener('mouseup', e => {
            if (!moving) return;
            moving = false;
            const dx = e.clientX - startX;
            if (currentPage === 0 && dx < -50) currentPage = 1;
            else if (currentPage === 1 && dx > 50) currentPage = 0;
            slider.style.transform = `translateX(${-currentPage * 100}%)`;
            updateIndicator();
        });

        // 头像预览函数：选择图片后显示
        function previewAvatar(cardNum, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('smallAvatar' + cardNum).src = e.target.result;
                    document.getElementById('previewAvatar' + cardNum).src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 实时更新卡片1内容
        function updateCard1() {
            document.getElementById('previewName1').textContent = document.getElementById('userName1').value || '未知用户';
            document.getElementById('previewText1').textContent = document.getElementById('messageText1').value || '请输入内容';
            document.getElementById('previewSource1').textContent = document.getElementById('sourceText1').value || '来源';
            document.getElementById('previewTime1').textContent = document.getElementById('timeText1').value || '时间';
            document.getElementById('previewLike1').textContent = '点赞' + (document.getElementById('likeNum1').value || '0');
        }

        // 实时更新卡片2内容
        function updateCard2() {
            document.getElementById('previewName2').textContent = document.getElementById('userName2').value || '未知用户';
            document.getElementById('previewText2').textContent = document.getElementById('messageText2').value || '请输入内容';
            document.getElementById('previewSource2').textContent = document.getElementById('sourceText2').value || '来源';
            document.getElementById('previewTime2').textContent = document.getElementById('timeText2').value || '时间';
            document.getElementById('previewLike2').textContent = '点赞' + (document.getElementById('likeNum2').value || '0');
        }
    </script>
</body>
</html>
